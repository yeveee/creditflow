# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/creditflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:creditflow_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:creditflow_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8080

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.scoring.sliding-window-size=5
resilience4j.circuitbreaker.instances.scoring.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.scoring.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.scoring.permitted-number-of-calls-in-half-open-state=3

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# JWT
jwt.secret=${JWT_SECRET:creditflow-secret-key-qui-doit-etre-tres-longue-pour-HS256}

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true