name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: creditflow
          POSTGRES_USER: creditflow_user
          POSTGRES_PASSWORD: creditflow_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditflow_user -d creditflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean verify
        working-directory: creditflow

      - name: Build Docker image
        run: docker build -t creditflow:latest .
        working-directory: creditflow